name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker images
        run: |
          docker compose build
          
          # Tag and push main services
          docker tag aether-uap-aether-perception:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-perception:latest
          docker tag aether-uap-aether-agent:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent:latest
          docker tag aether-uap-aether-meta:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-meta:latest
          
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-perception:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-meta:latest

      - name: List pushed images
        run: docker images | grep ghcr.io
