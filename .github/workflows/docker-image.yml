name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker images
        run: |
          echo "Building all services..."
          docker compose build --progress=plain || (echo "Build failed. Showing logs..." && docker compose logs --tail=50)
